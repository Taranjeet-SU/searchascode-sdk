[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-as-code"
dynamic = ["version"]
description = "A unified 'search as code' agentic harness — one API, any vector database."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "search-as-code contributors" }]
keywords = ["rag", "retrieval", "agents", "vector-search", "code-mode", "search-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/oro-jackson/searchascode-sdk"
Repository = "https://github.com/oro-jackson/searchascode-sdk"
Issues = "https://github.com/oro-jackson/searchascode-sdk/issues"

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.7"]
faiss = ["faiss-cpu>=1.7"]
sqlite = []                       # stdlib only — declared so `available()` and the docs agree
# explore/training.py imports sklearn (and optionally xgboost); Explorer.fit() on a base
# install used to die with a bare ModuleNotFoundError instead of MissingDependencyError.
learn = ["scikit-learn>=1.3"]
learn-xgb = ["scikit-learn>=1.3", "xgboost>=2.0"]
# rerankers.py / embeddings.py lazy-import these with no extra of their own.
local-models = ["torch>=2.0", "sentence-transformers>=2.2", "transformers>=4.40,<5"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
opensearch = ["opensearch-py>=2.4"]
providers = ["openai>=1.0"]
# Everything the phase1 benchmark/functional-test need beyond the core SDK.
phase1 = [
    "opensearch-py>=2.4",
    "openai>=1.0",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    # upper bound is deliberate: transformers 5.x materialises non-persistent RoPE
    # buffers as uninitialised memory, silently collapsing recall (issues.md BC-4).
    "transformers>=4.40,<5",
    "langchain-openai>=0.1",
    "requests>=2.28",
]
dev = ["pytest>=7", "pytest-cov", "ruff>=0.4", "mypy>=1.8"]
all = [
    "opensearch-py>=2.4",          # was MISSING from `all` although every experiment uses it
    "qdrant-client>=1.7",
    "chromadb>=0.5",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "faiss-cpu>=1.7",
    "scikit-learn>=1.3",
    "openai>=1.0",
]

[tool.setuptools.dynamic]
version = { attr = "search_as_code.__version__" }

[tool.setuptools.packages.find]
include = ["search_as_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["search_as_code"]
omit = ["*/adapters/qdrant.py", "*/adapters/chroma.py", "*/adapters/pgvector.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905", "B027"]

[tool.mypy]
# Target 3.12 so mypy can parse numpy's stubs (which use 3.12 `type` statements);
# runtime 3.10 support is enforced by ruff target-version and the CI test matrix.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["phase1/", "examples/", "tests/"]
